server:
  port: 18081

spring:
  application:
    name: auth-service
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:public}
      config:
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info

mylunarcore:
  auth:
    jwt:
      secret: "change-me-to-a-secure-32-byte-secret!"
      issuer: "mylunarcore-auth-service"
      expire-minutes: 120
      users:
        player10001:
          password: "123456"
          uid: 10001
          role: "player"
        admin:
          password: "admin123"
          uid: 1
          role: "admin"
