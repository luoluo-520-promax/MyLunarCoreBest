apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lunarcore-game
  labels:
    app: lunarcore-game
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lunarcore-game
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Pods
      pods:
        metric:
          name: lunarcore_battle_pool_usage
        target:
          type: AverageValue
          averageValue: "700m" # 0.70
    - type: Pods
      pods:
        metric:
          name: lunarcore_match_queue_depth
        target:
          type: AverageValue
          averageValue: "30"
    - type: Pods
      pods:
        metric:
          name: lunarcore_sla_battle_success_rate
        target:
          type: AverageValue
          # 成功率过低时也会触发扩容（prometheus-adapter 需配置反向或另用告警降级）
          averageValue: "990m"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
