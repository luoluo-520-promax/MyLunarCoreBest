global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: mylunarcore-game
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          app: game-server

  - job_name: mylunarcore-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:18443"]
        labels:
          app: api-gateway
    scheme: https
    tls_config:
      insecure_skip_verify: true

alerting:
  alertmanagers: []

rule_files:
  - /etc/prometheus/rules/*.yml
