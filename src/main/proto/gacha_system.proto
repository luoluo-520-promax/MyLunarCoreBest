syntax = "proto3";

package cn.itcast.demo.mylunarcore.proto;

option java_package = "cn.itcast.demo.mylunarcore.protocol";
option java_outer_classname = "GachaSystemProto";

message GetGachaInfoCsReq {
}

message PlayerPityInfo {
  uint32 pity_5 = 1;
  uint32 pity_4 = 2;
  uint32 failed_up_count = 3;
  bool guarantee_5 = 4;
}

message CeilingInfo {
  uint32 ceiling_num = 1;
  bool ceiling_claimed = 2;
}

message GachaBannerInfo {
  uint32 banner_type = 1;  // 1-新手,2-常驻,11-角色UP,12-武器UP
  uint32 banner_id = 2;    // 配置ID
  string name = 3;
  uint64 begin_time = 4;
  uint64 end_time = 5;
  uint32 cost_item_id = 6;
  uint32 cost_count = 7;
  repeated uint32 rate_up_items_5 = 8;
  repeated uint32 rate_up_items_4 = 9;
  uint32 event_chance = 10; // 50/50 获胜概率(百分比)
  PlayerPityInfo player_pity = 11;
}

message GetGachaInfoScRsp {
  int32 retcode = 1;
  repeated GachaBannerInfo banners = 2;
  CeilingInfo ceiling_info = 3; // 仅常驻池有效，没数据时返回默认(0,false)
}

message DoGachaCsReq {
  uint32 banner_type = 1;
  uint32 times = 2; // 1 or 10
  /** 客户端幂等 nonce；与 GachaStart 三次握手共用 */
  string client_nonce = 3;
}

message GachaItem {
  uint32 item_id = 1;
  uint32 count = 2;
  bool is_new = 3;
  /** 本次是否解锁了新的命座层 */
  bool is_new_constellation = 4;
  /** 当前命座层（0=基础，上限6） */
  int32 current_layer = 5;
}

message ExtraReward {
  uint32 item_id = 1;
  uint32 count = 2;
}

message DoGachaScRsp {
  int32 retcode = 1;
  uint32 banner_type = 2;
  repeated GachaItem items = 3;
  repeated ExtraReward extra_rewards = 4;
  PlayerPityInfo updated_pity = 5;
  CeilingInfo updated_ceiling = 6;
  /** 表现会话 ID：客户端播完动画后回 GachaResultAck */
  string presentation_session_id = 7;
  /** 下发客户端表演参数（特效/镜头/文案占位） */
  ClientUiParams client_ui = 8;
  /** 抽卡返利积分增量 */
  uint32 rebate_points_gained = 9;
  uint32 rebate_points_balance = 10;
}

/** 抽卡结果推送（可选）：含命座层变化，便于客户端即时点亮星星 */
message GachaResultScNotify {
  uint32 banner_type = 1;
  repeated GachaItem items = 2;
}

/**
 * 表现层状态机 — 开始：客户端在播放抽卡动画前发送，服务端预扣费校验并返回 session。
 * 状态流转：START → DRAWING → ACK(ENDED)
 */
message GachaStartCsReq {
  uint32 banner_type = 1;
  uint32 times = 2;
  string client_nonce = 3;
}

message GachaStartScRsp {
  int32 retcode = 1;
  string presentation_session_id = 2;
  ClientUiParams client_ui = 3;
  uint32 estimated_cost = 4;
}

/** 表现层状态机 — 结束确认：动画播完后客户端回执，服务端关闭会话并允许下一抽 */
message GachaResultAckCsReq {
  string presentation_session_id = 1;
  bool skipped = 2;
}

message GachaResultAckScRsp {
  int32 retcode = 1;
  string presentation_session_id = 2;
}

/** 客户端表现参数：特效 ID、镜头、文本占位符 */
message ClientUiParams {
  string fx_id = 1;
  string camera_preset = 2;
  map<string, string> text_placeholders = 3;
  string sfx_id = 4;
  string timeline_id = 5;
}

message ExchangeGachaCeilingCsReq {
  uint32 target_avatar_id = 1;
}

message ExchangeGachaCeilingScRsp {
  int32 retcode = 1;
  GachaItem reward_item = 2;
  CeilingInfo updated_ceiling = 3;
}

message GetGachaHistoryCsReq {
  uint32 banner_type = 1; // 0=all
  uint32 page = 2;
  uint32 page_size = 3;
}

message GachaHistoryRecord {
  uint64 timestamp = 1;
  uint32 banner_type = 2;
  uint32 item_id = 3;
  uint32 count = 4;
  bool is_new = 5;
}

message GetGachaHistoryScRsp {
  int32 retcode = 1;
  uint32 total_count = 2;
  repeated GachaHistoryRecord records = 3;
}

message GachaBannerUpdateScNotify {
  repeated GachaBannerInfo updated_banners = 1;
}

