syntax = "proto3";

package cn.itcast.demo.mylunarcore.proto;

option java_package = "cn.itcast.demo.mylunarcore.protocol";
option java_outer_classname = "SceneSystemProto";

// Shared position (renamed to avoid conflict with battle_system/player_session proto)
message SceneVec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message SceneLoadInfo {
  uint32 plane_id = 1;
  uint32 floor_id = 2;
  uint32 entry_id = 3;
  float pos_x = 4;
  float pos_y = 5;
  float pos_z = 6;
}

message MonsterEntity {
  uint32 entity_id = 1;
  uint32 monster_id = 2;
  uint32 level = 3;
  uint32 hp = 4;
  uint32 max_hp = 5;
  SceneVec3 pos = 6;
  repeated uint32 buffs = 7;
}

message NpcEntity {
  uint32 entity_id = 1;
  uint32 npc_id = 2;
  SceneVec3 pos = 3;
  uint32 rogue_event_id = 4;
}

message PropEntity {
  uint32 entity_id = 1;
  uint32 prop_id = 2;
  uint32 state = 3;
  SceneVec3 pos = 4;
}

message EntityList {
  repeated MonsterEntity monsters = 1;
  repeated NpcEntity npcs = 2;
  repeated PropEntity props = 3;
}

// 2.1 Enter scene
message EnterSceneCsReq {
  uint32 plane_id = 1;
  uint32 floor_id = 2;
  uint32 entry_id = 3;
  float pos_x = 4;
  float pos_y = 5;
  float pos_z = 6;
  string migration_ticket = 7; // 跨节点迁移恢复票据
}

message EnterSceneScRsp {
  int32 retcode = 1;
  SceneLoadInfo scene_info = 2;
  EntityList entity_list = 3;
}

// 2.2 Get current scene
message GetCurSceneInfoCsReq {}

message GetCurSceneInfoScRsp {
  int32 retcode = 1;
  SceneLoadInfo scene_info = 2;
  EntityList entity_list = 3;
}

// 3.1 Interact NPC
message NpcDialogOption {
  uint32 option_id = 1;
  string text = 2;
}

message InteractNpcCsReq {
  uint32 entity_id = 1;
  uint32 option = 2;
  bytes extra_data = 3;
}

message InteractNpcScRsp {
  int32 retcode = 1;
  uint32 entity_id = 2;
  uint32 dialogue_id = 3;
  string dialogue_content = 4;
  repeated NpcDialogOption options = 5;
  bytes rogue_event_result = 6;
}

// 3.2 Pickup prop
message SceneRewardItem {
  uint32 item_id = 1;
  uint32 count = 2;
}

message PickupPropCsReq {
  uint32 entity_id = 1;
}

message PickupPropScRsp {
  int32 retcode = 1;
  uint32 entity_id = 2;
  repeated SceneRewardItem reward_items = 3;
  uint32 prop_state = 4;
}

// 3.3 Player move
message PlayerEntityInfo {
  uint64 player_uid = 1;
  SceneVec3 pos = 2;
  float rot_y = 3;
}

enum MoveState {
  MOVE_STATE_UNSPECIFIED = 0;
  WALK = 1;
  RUN = 2;
  JUMP = 3;
  CLIMB = 4; // 仅低矮障碍物
}

message MoveCsReq {
  float pos_x = 1;
  float pos_y = 2;
  float pos_z = 3;
  float rot_y = 4;
  MoveState move_state = 5;
  /** 客户端本地时钟（毫秒），用于 100ms 预测先行窗口 */
  uint64 client_tick_ms = 6;
  /** 水平轨迹速度向量（单位/秒）；服务端校验轨迹而非逐帧精确坐标 */
  float velocity_x = 7;
  float velocity_z = 8;
}

message MoveScRsp {
  int32 retcode = 1;
  SceneVec3 pos = 2;
  MoveState move_state = 3;
  /** true=本帧接受了客户端预测坐标（未强制回写权威点） */
  bool prediction_accepted = 4;
  /** 服务端建议的预测窗口（毫秒） */
  uint32 prediction_window_ms = 5;
}

/** 跳跃落地 / 踩踏不同地板时的触觉与音效反馈 */
message SceneInteractPhysicsScNotify {
  uint32 player_uid = 1;
  MoveState move_state = 2;
  string floor_material = 3; // wood | metal | grass
  uint32 haptic_strength = 4; // 0-100
  uint32 footstep_sfx_id = 5;
  bool landing = 6;
}

message SceneEmoteCsReq {
  uint32 emote_id = 1;
  uint64 target_player_uid = 2; // 双人互动目标，0=单人动作
}

message SceneEmoteScRsp {
  int32 retcode = 1; // 0成功 1未登录 2无场景 3未拥有表情 4目标不在 AOI
  uint32 emote_id = 2;
  bool duo = 3;
}

message SceneEmoteScNotify {
  uint64 player_uid = 1;
  uint32 emote_id = 2;
  uint64 target_player_uid = 3;
  bool duo = 4;
  string anim_id = 5;
}

message MigrateSceneCsReq {
  uint32 target_plane_id = 1;
  uint32 target_floor_id = 2;
  uint32 target_entry_id = 3;
  float pos_x = 4;
  float pos_y = 5;
  float pos_z = 6;
}

message MigrateSceneScRsp {
  int32 retcode = 1; // 0=本机完成；4=需重连目标节点（带 redirect_* / session_ticket）；10=等待客户端加载
  uint32 zone_id = 2;
  SceneLoadInfo scene_info = 3;
  string redirect_host = 4;
  uint32 redirect_port = 5;
  string session_ticket = 6;
  /** 切图加载票据（单机/跨节点共用语义）；客户端加载完成后上报 SceneLoadComplete */
  string loading_ticket = 7;
  /** 是否命中后台预加载：true 时 LoadingTicket 仅作校验握手，感知加载更短 */
  bool preload_hit = 8;
  /** 加载遮罩元数据：插画/角色动态，替代单纯进度条 */
  SceneLoadMaskInfo mask_info = 9;
}

/** 接近传送门/区域边界时后台预加载目标 Plane 低模与基础数据 */
message ScenePreloadCsReq {
  uint32 target_plane_id = 1;
  uint32 target_floor_id = 2;
  uint32 target_entry_id = 3;
  /** 1=传送门接近 2=区域边界 3=任务强制 */
  uint32 reason = 4;
}

message ScenePreloadScRsp {
  int32 retcode = 1; // 0受理 1未登录 2参数非法 5=预加载风暴限流(BLACK)
  uint32 target_plane_id = 2;
  uint32 target_floor_id = 3;
  /** 建议客户端拉取的资源包键（低模/基础数据） */
  repeated string asset_keys = 4;
  SceneLoadMaskInfo mask_info = 5;
  /** 预估剩余毫秒（仅提示） */
  uint32 estimated_ms = 6;
  /** true=10s 内请求过多，已拒绝额外计算 */
  bool storm_throttled = 7;
}

/** 服务端确认预加载就绪（KCP 可靠推送） */
message ScenePreloadReadyScNotify {
  uint32 target_plane_id = 1;
  uint32 target_floor_id = 2;
  repeated string asset_keys = 3;
  bool ready = 4;
}

/** 服务端强制预加载：接近传送门且目标 Zone 空闲时不等客户端请求 */
message ScenePreloadPushScNotify {
  uint32 target_plane_id = 1;
  uint32 target_floor_id = 2;
  uint32 target_entry_id = 3;
  repeated string asset_keys = 4;
  SceneLoadMaskInfo mask_info = 5;
  /** 低模占位资源键 */
  repeated string lod_placeholder_keys = 6;
  /** 1=传送门接近 2=Zone 空闲强制 3=移动方向预判（提前 2~3 身位） */
  uint32 reason = 7;
  /** true=预加载风暴限流，客户端应展示 BLACK 遮罩并停止额外计算 */
  bool storm_throttled = 8;
}

/**
 * 场景节流：BattleTick 积压时通知客户端/场景侧降低 NPC 刷新率，保战斗流畅。
 */
message ThrottleScNotify {
  /** 建议 NPC/场景刷新 Hz（如 5→2） */
  uint32 scene_tick_hz = 1;
  /** 原因：battle_backlog | storm | manual */
  string reason = 2;
  uint32 battle_queue_lag_ms = 3;
  uint64 until_ms = 4;
}

/** 切图遮罩：地区概念插画 / 短角色动态 */
message SceneLoadMaskInfo {
  string illustration_id = 1; // 地区插画资源 ID
  string character_anim_id = 2; // 角色短动态 ID
  string tip_text = 3; // 遮罩文案
  string mask_style = 4; // illustration | character_loop | hybrid
  /** BLACK | FADE | DISSOLVE(元素溶解) | RIFT(裂缝穿梭)；客户端着色器按类型播放 */
  string transition_type = 5;
  /** 推荐 UI 皮肤：pc_km / mobile_touch / console_gamepad */
  string recommended_layout_id = 6;
  /** 预加载命中率（万分比，9000=90%） */
  uint32 hit_rate_bp = 7;
  /** 过渡特效持续时间（毫秒），加载应在此窗口内完成 */
  uint32 duration_ms = 8;
}

/** 剧情选项环境联动：NPC 微表情 / 粒子 / BGM 变奏 */
message SceneEnvironmentModifyScNotify {
  string effect_type = 1; // npc_micro_expression | heart_particles | bgm_variation
  string npc_id = 2;
  string expression = 3; // smile | blush | nod
  string particle_id = 4;
  string bgm_variation_id = 5;
  repeated string impact_tags = 6;
  uint32 duration_ms = 7;
  /** 目标场景实体（0=当前说话 NPC） */
  uint32 target_entity_id = 8;
  /** 面部情绪控制器 ID：happy / sad / surprised */
  string emotion_id = 9;
}

/** 环境微交互触发类型 */
enum EnvMicroInteractType {
  ENV_MICRO_UNSPECIFIED = 0;
  KICK_PEBBLE = 1;   // 踢飞小石子
  RUSTLE_GRASS = 2;  // 草丛晃动
  WATER_RIPPLE = 3;  // 水面涟漪
}

/** 服务端仅下发坐标+类型，客户端播粒子（极轻量） */
message SceneEnvMicroInteractScNotify {
  uint64 player_uid = 1;
  EnvMicroInteractType interact_type = 2;
  SceneVec3 pos = 3;
  string particle_id = 4;
  uint32 intensity = 5; // 0-100
}

/** 客户端性能探针（建议 5s 上报一次） */
message ReportDevicePerfCsReq {
  float soc_temp_c = 1;      // SoC 温度℃
  uint32 fps = 2;            // 当前帧率
  uint32 battery_percent = 3; // 电量 0-100
  string device_id = 4;
}

message ReportDevicePerfScRsp {
  int32 retcode = 1; // 0成功 1未登录 2参数非法
  bool adjust_pushed = 2;
}

/** 服务端渲染降级指令（防烫手人文关怀） */
message ScenePerformanceAdjustScNotify {
  uint32 render_tier = 1; // 0强制低 1中 2高
  bool disable_npc_silhouette = 2;
  bool reduce_far_lod = 3;
  uint32 target_fps_cap = 4;
  string reason = 5; // thermal | low_fps | battery | device_profile
  float soc_temp_c = 6;
  /** QualityPreset id：low/medium/high/ultra */
  string preset_id = 7;
  uint32 shadow_quality = 8;
  uint32 particle_budget = 9;
  float view_distance = 10;
}

/** 箱庭世界时段 */
enum WorldTimePeriod {
  WORLD_TIME_UNSPECIFIED = 0;
  DAWN = 1;
  NOON = 2;
  DUSK = 3;
  NIGHT = 4;
}

message GetWorldTimeCsReq {}

message GetWorldTimeScRsp {
  int32 retcode = 1;
  int64 world_time_ms = 2;       // 全局 WorldTime 时间戳
  WorldTimePeriod period = 3;
  uint32 period_elapsed_ms = 4;  // 当前时段已过去
  uint32 period_duration_ms = 5; // 当前时段总长
}

message WorldTimeScNotify {
  int64 world_time_ms = 1;
  WorldTimePeriod period = 2;
  string skybox_preset = 3; // dawn | noon | dusk | night
  uint32 transition_ms = 4;
}

/** 死亡荧光残影（仅存坐标，30 分钟） */
message SceneDeathEcho {
  string echo_id = 1;
  uint64 owner_uid = 2;
  uint32 plane_id = 3;
  SceneVec3 pos = 4;
  int64 expire_at_ms = 5;
}

message SceneDeathEchoSyncScNotify {
  repeated SceneDeathEcho echoes = 1;
  string reason = 2; // spawn | expire | comfort | enter_aoi
}

message ComfortDeathEchoCsReq {
  string echo_id = 1;
}

message ComfortDeathEchoScRsp {
  int32 retcode = 1; // 0成功 1未登录 2不存在/过期 3不可抚慰自己 4已抚慰
  string echo_id = 2;
}

/** AI 助手：地图荧光引路线 */
message SceneNavigateScNotify {
  string route_id = 1;
  string title = 2;
  repeated SceneVec3 waypoints = 3;
  string line_style = 4; // glow_path
  uint32 duration_ms = 5;
  string source = 6; // ai_assist
}

/** AI 助手：自动寻路至材料掉落门前 */
message AutoPathFindPushScNotify {
  string target_label = 1;
  uint32 target_plane_id = 2;
  uint32 target_entry_id = 3;
  SceneVec3 target_pos = 4;
  string item_hint = 5;
  string source = 6; // ai_assist
}

/** 客户端场景资源加载完成，解除 LOADING 态（恢复移动/开战） */
message SceneLoadCompleteCsReq {
  string loading_ticket = 1;
}

message SceneLoadCompleteScRsp {
  int32 retcode = 1; // 0成功 1未登录 2票据无效/过期
  /** true=本次仅为预加载握手校验，客户端可跳过重遮罩 */
  bool handshake_only = 2;
  string transition_type = 3; // BLACK | FADE | DISSOLVE | RIFT
}

// 3.4 Trigger scene event
message TriggerSceneEventCsReq {
  uint32 entity_id = 1;
  uint32 trigger_type = 2;
  int32 param1 = 3;
  int32 param2 = 4;
}

message UpdatedEntityState {
  uint32 entity_id = 1;
  uint32 state = 2;
}

message TriggerSceneEventScRsp {
  int32 retcode = 1;
  uint32 entity_id = 2;
  bytes result_data = 3;
  repeated UpdatedEntityState updated_entities = 4;
}

// 4.1 Scene entity sync notify
message MonsterEntityInfo {
  uint32 monster_id = 1;
  uint32 level = 2;
  uint32 hp = 3;
  uint32 max_hp = 4;
  SceneVec3 pos = 5;
  repeated uint32 buffs = 6;
}

message NpcEntityInfo {
  uint32 npc_id = 1;
  SceneVec3 pos = 2;
  uint32 rogue_event_id = 3;
}

message PropEntityInfo {
  uint32 prop_id = 1;
  uint32 state = 2;
  SceneVec3 pos = 3;
}

message SummonEntityInfo {
  uint32 summon_config_id = 1;
  uint32 duration = 2;
  SceneVec3 pos = 3;
  uint32 attached_entity_id = 4;
  uint32 hp = 5;
  uint32 max_hp = 6;
}

message SceneEntityInfo {
  oneof kind {
    MonsterEntityInfo monster = 1;
    NpcEntityInfo npc = 2;
    PropEntityInfo prop = 3;
    SummonEntityInfo summon = 4;
    PlayerEntityInfo player = 5;
  }
}

message SceneEntityData {
  uint32 entity_id = 1;
  uint32 entity_type = 2; // 1-monster,2-npc,3-prop,4-summon
  SceneEntityInfo entity_info = 3;
}

message SceneEntitySyncScNotify {
  uint32 sync_type = 1; // 1-add,2-remove,3-update
  repeated SceneEntityData entity_data = 2;
}

// 5 Summon unit notify
message SummonUnitCreateScNotify {
  uint32 caster_uid = 1;
  uint32 summon_entity_id = 2;
  uint32 summon_config_id = 3;
  uint32 duration = 4;
  SceneVec3 pos = 5;
  uint32 attached_entity_id = 6;
  uint32 hp = 7;
  uint32 max_hp = 8;
}

message SummonUnitRemoveScNotify {
  uint32 summon_entity_id = 1;
  uint32 reason = 2;
}

// 6 Healing spring
message UseHealingSpringCsReq {
  uint32 entity_id = 1;
}

message HealEffect {
  uint32 hp_recovered = 1;
}

message UseHealingSpringScRsp {
  int32 retcode = 1;
  uint32 entity_id = 2;
  HealEffect heal_effect = 3;
  bool respawn_point_set = 4;
}

/** 切图/进场景：服务端下发阻挡多边形，供客户端本地预碰撞 */
message CollisionPolygon {
  repeated float xz = 1; // 交错存储 x0,z0,x1,z1,...
}

message SceneCollisionMeshScNotify {
  uint32 plane_id = 1;
  float capsule_radius = 2;
  float capsule_height = 3;
  repeated CollisionPolygon blockers = 4;
  bool smooth_correction = 5;
}

/** NPC/生物日程行为（客户端动画状态机切换，非仅休眠降频） */
enum NpcBehaviorType {
  NPC_BEHAVIOR_UNSPECIFIED = 0;
  NPC_BEHAVIOR_IDLE = 1;            // IdleAnimation
  NPC_BEHAVIOR_PATROL = 2;          // WaypointMove 巡逻
  NPC_BEHAVIOR_SLEEP = 3;           // 回屋睡觉
  NPC_BEHAVIOR_WORK = 4;            // InteractionSpot 摆摊/工作
  NPC_BEHAVIOR_DESPAWN = 5;         // 夜间消失
  NPC_BEHAVIOR_OPEN_SHOP = 6;       // 开摊
}

message SceneNpcBehaviorScNotify {
  uint32 entity_id = 1;
  uint32 npc_id = 2;
  NpcBehaviorType behavior = 3;
  SceneVec3 pos = 4;
  SceneVec3 target_pos = 5;         // 巡逻/回家目标点
  WorldTimePeriod period = 6;
  string anim_hint = 7;             // 客户端状态机 hint，如 walk/sleep/vend
  string interaction_spot = 8;      // InteractionSpot id
  uint32 transition_ms = 9;
  bool visible = 10;                // false=DESPAWN 从场景隐藏
}

