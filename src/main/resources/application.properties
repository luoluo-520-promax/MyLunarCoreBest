spring.application.name=MyLunarCore
spring.profiles.default=dev

logging.file.path=logs

server.port=8080

server.ssl.enabled=false
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12

lunarcore.netty-port=9000
# 0=max(4, CPU×2)；压测回填后可固定（如 16）
lunarcore.netty.business-threads=0

lunarcore.game-tcp-enabled=true

lunarcore.tls.game-tcp-enabled=false
lunarcore.tls.key-store=classpath:keystore.p12
lunarcore.tls.key-store-password=${TLS_KEY_STORE_PASSWORD:changeit}
lunarcore.tls.key-store-type=PKCS12
lunarcore.tls.key-password=${TLS_KEY_PASSWORD:changeit}

lunarcore.game-kcp-enabled=true
lunarcore.kcp.interval=20
lunarcore.kcp.mtu=1400
# KCP 重传策略：fixed（默认）| adaptive（弱网自适应）
lunarcore.kcp.retransmit.algo=fixed
lunarcore.kcp.retransmit.rtt-throttle-ms=250
lunarcore.kcp.retransmit.max-inflight=256

# 战斗断线快照（Redis 优先，否则进程内存）
lunarcore.battle-snapshot.enabled=true
lunarcore.battle-snapshot.ttl-seconds=7200

# 配置热更灰度（关闭=全量生效）
lunarcore.config-gray.enabled=false
lunarcore.config-gray.uid-tails=
lunarcore.config-gray.server-ids=
lunarcore.config-gray.note=

# 协议命令号动态盐 HMAC（与 KCP AES-GCM 正交）
lunarcore.protocol-hmac.enabled=false

# 业务虚拟线程（默认关；开启后提供 VT sidecar 执行器）
lunarcore.netty.virtual-threads-enabled=false

lunarcore.game-loop.enabled=true
lunarcore.game-loop.period-ms=1000
# ZoneTick 10Hz；BattleTick 5Hz（崩铁式分区世界 + 独立战局时钟）
lunarcore.game-loop.zone-period-ms=100
lunarcore.game-loop.battle-period-ms=200
lunarcore.activity-schedule-resource=file:data/ActivityScheduling.json
lunarcore.activity-configs-resource=file:data/ActivityConfigs.json
lunarcore.activity-detail-dir=activities
lunarcore.data-dir=data

lunarcore.hotfix.resource=file:data/hotfix.json

# 中心服：local=进程内；remote=HTTP 查询 lunarcore.center.remote-base-url
lunarcore.center.mode=local
lunarcore.center.local-node-id=local
lunarcore.center.remote-base-url=
lunarcore.center.advertise-host=127.0.0.1
lunarcore.center.advertise-port=0
lunarcore.center.zone-lease-ms=15000
lunarcore.center.heartbeat-ms=3000

# Redis：默认关闭（内存票据/在线表）；双节点切服请开启并指向共享 Redis
lunarcore.redis.enabled=false
lunarcore.redis.host=127.0.0.1
lunarcore.redis.port=6379
lunarcore.redis.password=
lunarcore.redis.database=0
lunarcore.redis.ticket-key-prefix=lunar:mig:ticket:
lunarcore.redis.online-key=lunar:online:uids
lunarcore.redis.leaderboard-key-prefix=lunar:lb:
lunarcore.redis.chat-world-channel=lunar:chat:world
lunarcore.redis.chat-private-channel=lunar:chat:private
lunarcore.redis.party-key-prefix=lunar:party:
lunarcore.redis.party-uid-key-prefix=lunar:party:uid:
# 钱包分布式锁前缀（代码内：lunar:lock:wallet:{playerId}）；TTL 由 DistributedLockService 控制
lunarcore.redis.ticket-ttl-seconds=120
# 多节点推荐 true：启用 Redisson RLock（需同时 enabled=true）
lunarcore.redis.redisson-enabled=false

# 切服迁移限流/重试
lunarcore.migration.max-per-second=200
lunarcore.migration.max-retries=3

# Outbox 投递预演（默认关；联调可开）
lunarcore.outbox.relay-enabled=false
lunarcore.outbox.relay-interval-ms=15000
# 失败事务补偿（抽卡扣费后发奖失败退款等）
lunarcore.tx.compensation-enabled=true
lunarcore.tx.compensation-interval-ms=30000

# Zipkin / 链路追踪采样（0=关闭导出；生产建议 0.05–0.2；跨服务含 AI sidecar 透传 TraceId）
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}
# 结构化日志：JSON 便于 Loki/ELK；本地可读可改回默认 pattern
logging.structured.format.console=${LOGGING_STRUCTURED_CONSOLE:}
# logging.pattern.console 保持默认；生产可设 LOGGING_STRUCTURED_CONSOLE=ecs 或 json（Boot 4）

# HikariCP：按预估并发调优（正式开服前结合压测回填）
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MyLunarCoreHikari

# 管理后台 IP 白名单（空=不启用；生产建议填写 VPN/内网 CIDR）
lunarcore.admin.ip-whitelist=

# Zone 同图人数上限（配合 AOI 异步 + 动态分线；单线默认 1000）
lunarcore.zone.max-players=1000
lunarcore.zone.reject-draining=true
lunarcore.zone.adaptive-capacity-enabled=true
lunarcore.zone.adaptive-tick-budget-ms=8
lunarcore.zone.dynamic-line-enabled=true
lunarcore.zone.max-lines=8
lunarcore.zone.aoi-async-enabled=true
lunarcore.zone.aoi-async-workers=2
lunarcore.zone.aoi-async-queue-capacity=8192
lunarcore.zone.actor-mailbox-enabled=true

# 读写分离 / 影子库（默认关；压测开 routing + x-pt-load）
lunarcore.datasource.routing-enabled=false
lunarcore.datasource.fallback-replica-to-primary=true
lunarcore.datasource.shard-count=16

# 告警 Webhook / 日志采样
lunarcore.alert-webhook.enabled=false
lunarcore.alert-webhook.provider=feishu
lunarcore.alert-webhook.url=
lunarcore.log-sampling.enabled=true
lunarcore.log-sampling.battle-debug-sample-rate=0.0
lunarcore.log-sampling.battle-debug-uid-allowlist=

# AI 策略代理（实验）
lunarcore.ai-assist.battle-strategy-proxy-enabled=false

# 无缝大世界实验（默认关：崩铁式仍用 Plane/Floor + 遭遇回合战）
lunarcore.world.cell-size=64
lunarcore.world.cell-handoff-enabled=false
lunarcore.world.realtime-combat-enabled=false
lunarcore.world.realtime-max-declared-damage=50000
lunarcore.world.realtime-skill-min-cd-ms=200

# 抽卡扣费（钱包货币，与 Banner cost_item_id 展示对齐）
lunarcore.gacha-economy.cost-enabled=true
lunarcore.gacha-economy.cost-currency-id=101
lunarcore.gacha-economy.cost-per-draw=1

# 反作弊最小集
lunarcore.anti-cheat.move-speed-check-enabled=true
lunarcore.anti-cheat.max-move-speed=25
lunarcore.anti-cheat.move-speed-burst-factor=1.8
lunarcore.anti-cheat.min-move-interval-ms=30

# 内部 HTTP（/internal/**）与 AI 旁路共用密钥；生产用 INTERNAL_API_TOKEN 注入，禁止空值
lunarcore.internal-api-token=${INTERNAL_API_TOKEN:${AI_ASSIST_INTERNAL_TOKEN:dev-internal-token}}
# 密钥轮换宽限期旧密钥（见 docs/secret-rotation.md）；季度轮换时先写 previous 再切 current
lunarcore.internal-api-token-previous=${INTERNAL_API_TOKEN_PREVIOUS:}
# 内部服务 IP/CIDR 白名单（空=不启用）
lunarcore.internal-api.ip-whitelist=${INTERNAL_API_IP_WHITELIST:}
# 明文密码兼容默认关闭；迁移期可临时开启并登录后重哈希
lunarcore.security.allow-plaintext-password-match=false

# 敏感接口 UID/IP 限流
lunarcore.rate-limit.sensitive-enabled=true
lunarcore.rate-limit.gacha-enabled=true
lunarcore.rate-limit.gacha-uid-per-minute=60
lunarcore.rate-limit.gacha-ip-per-minute=120
lunarcore.rate-limit.stamina-uid-per-minute=20
lunarcore.rate-limit.stamina-ip-per-minute=30

# 好友助战
lunarcore.support.daily-borrow-limit=5
lunarcore.support.borrow-cooldown-seconds=300

# SpringDoc（Admin）
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=cn.itcast.demo.mylunarcore.admin

# stdin /reload disabled by default; use POST /api/admin/ops/reload (admin:ops:write)
lunarcore.reload-console-enabled=false

lunarcore.session.timeout-seconds=60
lunarcore.session.max-online-players=0

# AI 辅助（方案 A 规则教练默认开启；方案 B LLM 默认关闭，可降级到规则）
lunarcore.ai-assist.enabled=true
lunarcore.ai-assist.rule-coach-enabled=true
lunarcore.ai-assist.llm-enabled=false
lunarcore.ai-assist.battle-hint-enabled=false
lunarcore.ai-assist.battle-feature-collect-enabled=true
lunarcore.ai-assist.match-score-enabled=true
lunarcore.ai-assist.guide-pack-resource=GuidePack.json
lunarcore.ai-assist.llm-endpoint=
lunarcore.ai-assist.llm-api-key=${AI_ASSIST_LLM_API_KEY:}
lunarcore.ai-assist.llm-timeout-ms=3000
lunarcore.ai-assist.llm-model=gpt-4o-mini
lunarcore.ai-assist.chat-mention-enabled=true
lunarcore.ai-assist.chat-mention-prefix=@助手
lunarcore.ai-assist.remote-enabled=false
lunarcore.ai-assist.remote-base-url=
lunarcore.ai-assist.remote-internal-token=${AI_ASSIST_INTERNAL_TOKEN:${INTERNAL_API_TOKEN:dev-internal-token}}
lunarcore.ai-assist.remote-timeout-ms=3000
lunarcore.ai-assist.per-uid-per-minute=20
lunarcore.ai-assist.coach-per-uid-per-minute=60
lunarcore.ai-assist.llm-per-uid-per-minute=10
lunarcore.ai-assist.daily-llm-budget=200
lunarcore.ai-assist.quota-idle-evict-minutes=30
lunarcore.ai-assist.sync-mode=false
lunarcore.ai-assist.inference-threads=0
lunarcore.ai-assist.inference-queue-capacity=256
lunarcore.ai-assist.answer-cache-ttl-seconds=120
lunarcore.ai-assist.answer-cache-max-size=10000
lunarcore.ai-assist.rag-min-score=1.5
lunarcore.ai-assist.llm-max-tokens=512
lunarcore.ai-assist.safety-rules-resource=AssistSafetyRules.json
lunarcore.ai-assist.coach-tips-resource=CoachTips.json
lunarcore.ai-assist.prefer-remote-only=true
lunarcore.ai-assist.conversation-history-max-turns=8
lunarcore.ai-assist.conversation-history-ttl-seconds=1800
lunarcore.ai-assist.conversation-history-max-chars=2400
lunarcore.ai-assist.conversation-redis-key-prefix=lunar:assist:conv:
lunarcore.ai-assist.env-key-prefix=${SPRING_PROFILES_ACTIVE:dev}
lunarcore.ai-assist.free-daily-llm-budget=10
lunarcore.ai-assist.vip-daily-llm-budget=50
lunarcore.ai-assist.vip-min-level=40
lunarcore.ai-assist.duplicate-question-window-seconds=60
lunarcore.ai-assist.duplicate-question-max-per-window=3
lunarcore.ai-assist.remote-circuit-failure-threshold=5
lunarcore.ai-assist.remote-circuit-open-ms=30000
lunarcore.ai-assist.similar-question-cache-threshold=0.90
lunarcore.ai-assist.strategy-version=baseline
lunarcore.ai-assist.gray-strategy-version=
lunarcore.ai-assist.gray-strategy-uid-tails=
lunarcore.ai-assist.gray-auto-rollback-fallback-rate=0.25
lunarcore.ai-assist.default-locale=zh-CN
lunarcore.ai-assist.compliance-disclaimer-enabled=true
lunarcore.ai-assist.compliance-disclaimer=助手建议仅供参考，最终以游戏内实际结果与官方说明为准。
lunarcore.ai-assist.semantic-safety-enabled=true
lunarcore.ai-assist.pii-redaction-enabled=true
lunarcore.ai-assist.proactive-coach-enabled=true
lunarcore.ai-assist.proactive-fail-streak=3
lunarcore.ai-assist.proactive-cooldown-seconds=600
lunarcore.ai-assist.proactive-stamina-full-enabled=true
lunarcore.ai-assist.rag-incremental-reload=true

lunarcore.sync.passive-interval-ms=60000
lunarcore.sync.async-load-threads=0
lunarcore.sync.async-load-queue-capacity=1024
lunarcore.sync.periodic-persistence-enabled=true
lunarcore.sync.periodic-persistence-interval-ms=30000
lunarcore.sync.shutdown-persist-timeout-ms=30000

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.access=read_only
management.metrics.tags.application=${spring.application.name}

# IAP：开发默认 Mock 验签；生产请在 application-prod 关闭
mylunarcore.iap.mock-verify=true
mylunarcore.iap.replay-ttl-seconds=604800
mylunarcore.iap.channel-health-check.enabled=true
mylunarcore.iap.channel-health-check.fail-fast=false
mylunarcore.iap.apple.enabled=false
mylunarcore.iap.apple.shared-secret=${IAP_APPLE_SHARED_SECRET:}
mylunarcore.iap.apple.bundle-id=${IAP_APPLE_BUNDLE_ID:}
mylunarcore.iap.apple.use-sandbox=true
mylunarcore.iap.google.enabled=false
mylunarcore.iap.google.package-name=${IAP_GOOGLE_PACKAGE_NAME:}
mylunarcore.iap.google.service-account-json=${IAP_GOOGLE_SERVICE_ACCOUNT_JSON:}
