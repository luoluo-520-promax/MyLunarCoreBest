# Local development: optional defaults for DB credentials and schema bootstrap.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/lunarcore?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

lunarcore.reload-console-enabled=true
