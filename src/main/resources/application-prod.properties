# Production profile: secrets from environment, no schema re-init, no stdin reload.
spring.sql.init.mode=never
lunarcore.reload-console-enabled=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 禁止回落到 application.properties 中的 changeit 默认值
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
lunarcore.tls.key-store-password=${TLS_KEY_STORE_PASSWORD}
lunarcore.tls.key-password=${TLS_KEY_PASSWORD}

# 生产强制注入内部 token，禁止使用 dev-internal-token
lunarcore.internal-api-token=${INTERNAL_API_TOKEN}
lunarcore.internal-api-token-previous=${INTERNAL_API_TOKEN_PREVIOUS:}
lunarcore.ai-assist.remote-internal-token=${AI_ASSIST_INTERNAL_TOKEN:${INTERNAL_API_TOKEN}}
lunarcore.ai-assist.env-key-prefix=prod
lunarcore.security.allow-plaintext-password-match=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

management.endpoint.health.show-details=never
# 生产仅暴露 health；prometheus 走管理端鉴权或独立网络策略
management.endpoints.web.exposure.include=health,info,prometheus
management.server.port=${MANAGEMENT_SERVER_PORT:8081}

# 生产禁止 Mock 验签，必须对接真实渠道；启动 ping 失败则 fail-fast
mylunarcore.iap.mock-verify=false
mylunarcore.iap.channel-health-check.enabled=true
mylunarcore.iap.channel-health-check.fail-fast=true
mylunarcore.iap.replay-ttl-seconds=604800

# 生产多节点建议启用 Redisson
lunarcore.redis.redisson-enabled=${REDIS_REDISSON_ENABLED:true}

# Outbox 预演可按需开启
lunarcore.outbox.relay-enabled=${OUTBOX_RELAY_ENABLED:false}

# 链路追踪采样（需部署 Zipkin/OTLP）
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.1}

# 生产强制 KCP 会话加密（明文 UDP 禁止）；若仅 TCP+TLS 可设 allow-plaintext=true 并关闭 KCP
lunarcore.kcp-crypto.enabled=true
lunarcore.kcp-crypto.allow-plaintext=false

# 生产强制协议 HMAC（登录后下发 session_crypto_key）
lunarcore.protocol-hmac.enabled=true

# 生产 Hikari 建议值（可按压测覆盖）
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:40}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:3000}

# 管理后台网络隔离：生产必须配置白名单（逗号分隔 IP/CIDR）
lunarcore.admin.ip-whitelist=${ADMIN_IP_WHITELIST:}

# 实验开关：无缝 Cell / 实时战斗权威默认关闭（崩铁式分区遇敌路线）
lunarcore.world.cell-handoff-enabled=false
lunarcore.world.realtime-combat-enabled=false

# 长期运营建议开启归档（冷热分离见 scripts/archive）
# 默认策略：流水/日志约 30–90 天；可用 category-retention 按类别覆盖
lunarcore.data-retention.archive-job-enabled=${ARCHIVE_JOB_ENABLED:true}
lunarcore.data-retention.ledger-archive-days=${LEDGER_ARCHIVE_DAYS:30}
lunarcore.data-retention.chat-archive-days=${CHAT_ARCHIVE_DAYS:30}
lunarcore.data-retention.gacha-history-days=${GACHA_HISTORY_DAYS:180}
lunarcore.data-retention.category-retention=${ARCHIVE_CATEGORY_RETENTION:ledger=30,chat=30,audit=90,gacha=180,battle=60,replay=30}
# lunarcore.data-retention.cold-archive-jdbc-url=${COLD_ARCHIVE_JDBC_URL:}

